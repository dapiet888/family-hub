name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Code quality and data protection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run protect
      - run: node --test scripts/data-protection.test.mjs
      - run: node --experimental-strip-types --test src/lib/app-data/app-data.test.ts src/lib/app-data/readiness-schedule.test.ts src/lib/auth/gate-identity.test.ts src/lib/auth/sign-in-gate.test.ts src/lib/bring-in.test.ts src/lib/sync/board.test.ts src/lib/calendar-features.test.ts
